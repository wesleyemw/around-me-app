<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AroundMe App</title>
    <link rel="stylesheet" type="text/css" href="src/css/home.css" />

    <link
      rel="preload"
      href="./node_modules/inter-ui/variable/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <link
      rel="preload"
      href="./src/fonts/HostGrotesk-Variable-Roman.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <script src="./src/js/app.js" type="module"></script>
  </head>
  <body>
    <div class="home-content">
      <header>
        <h2>Create a new map</h2>
        <form id="search-cities">
          <label for="search-place">Search a place</label>
          <input
            type="search"
            name="search-place"
            id="search-place"
            placeholder="City name"
            min="3"
            required
          />
          <button type="submit">Search</button>
        </form>
        <!-- search resul element -->
        <section id="search-results" popover></section>
      </header>
      <main id="home">
        <!--
        <nav>
          <a href="pages/map/">map</a>
        </nav>
        -->
        <section class="projects">
          <div class="container">
            <hgroup>
              <h3>Saved maps</h3>
            </hgroup>
          </div>
        </section>
        <template id="create-project-template">
          <dialog data-dialog="project-dialog" popover>
            <form name="create-project">
              <div class="field-group">
                <h3></h3>
                <p class="country-name"></p>
                <p class="population"></p>
              </div>
              <div class="field-group">
                <label for="project-name">Project name:</label>
                <input
                  type="text"
                  name="project-name"
                  id="project-name"
                  min="3"
                  required
                />
              </div>
              <input type="hidden" id="lon" name="lon" />
              <input type="hidden" id="lat" name="lat" />
              <button type="submit">Create</button>
            </form>
          </dialog>
        </template>

        <template id="edit-project-template">
          <dialog data-dialog="edit-project">
            <form name="edit-project">
              <div class="field-group">
                <label for="project-name">New name for the project:</label>
                <input
                  type="text"
                  name="project-name"
                  id="project-name"
                  min="3"
                  required
                />
              </div>
              <button type="submit">Save</button>
            </form>
          </dialog>
        </template>

        <template id="delete-project-template">
          <dialog data-dialog="delete-project" id="delete-dialog">
            <form action="delete-dialog">
              <div class="field-group">
                <p>Are you sure? This action cannot be undone</p>
              </div>
              <button type="submit" data-delete="no">
                No, get me outta here!
              </button>
              <button type="submit" data-delete="yes">Yes, I'm sure</button>
            </form>
          </dialog>
        </template>
      </main>
    </div>
  </body>
</html>
